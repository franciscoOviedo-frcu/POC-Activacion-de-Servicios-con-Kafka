services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/tmp/create-topics.sh
    entrypoint: ["/bin/bash", "/tmp/create-topics.sh"]

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" --quiet"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  activation-api:
    build:
      context: .
      dockerfile: apps/activation-api/Dockerfile
    container_name: activation-api
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      KAFKA_BROKERS: kafka:9092
      MONGO_URI: mongodb://mongo:27017/activation_api_db?replicaSet=rs0&directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: apps/billing-service/Dockerfile
    container_name: billing-service
    restart: on-failure
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGO_URI: mongodb://mongo:27017/billing_db?replicaSet=rs0&directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  provisioning-service:
    build:
      context: .
      dockerfile: apps/provisioning-service/Dockerfile
    container_name: provisioning-service
    restart: on-failure
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGO_URI: mongodb://mongo:27017/provisioning_db?replicaSet=rs0&directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: notification-service
    restart: on-failure
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGO_URI: mongodb://mongo:27017/notification_db?replicaSet=rs0&directConnection=true
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: 1025
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started

  demo-ui:
    build:
      context: .
      dockerfile: apps/demo-ui/Dockerfile
    container_name: demo-ui
    restart: on-failure
    ports:
      - "5173:5173"
    depends_on:
      - activation-api


